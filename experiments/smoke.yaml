# A real-inference smoke run: does the loop survive an actual model?
#
# Three speeds of check, with MEASURED costs rather than guessed ones:
#
#   pytest tests/          3s      no model at all (MockBackend). Structure.
#   this preset            ~8 min  2 cycles on qwen2.5:7b. Real inference.
#   experiments/*.yaml     hours   15-100 cycles. Results worth reading.
#
# The middle one exists because a mock backend emits schema-perfect JSON by
# construction, so no number of mock tests can find a parsing failure. The
# 2026-09-15 bug — a model opening a field with a Python triple-quote — passed
# all 604 mock tests and killed the first real cycle within minutes.
#
# TWO THINGS I GOT WRONG BUILDING THIS, both measured:
#
# A smaller model is SLOWER here. qwen2.5:0.5b ran 7.5 min/cycle against the
# 7b's 4.4, with 8 hard parse failures and 5 phase errors in two cycles. Below
# some size the model cannot hold the schemas, and the retries cost more than
# the smaller weights save. The floor on model size for this loop is schema
# compliance, not speed.
#
# And trimming the loop barely helps. Cutting discussion from 8 turns to 4 and
# retrieval to one query removes about a third of the calls and saves 9% —
# 4.0 min/cycle against 4.4. At ~14s per call on this hardware, per-call
# latency dominates and call count is nearly irrelevant. The only real lever on
# speed is tokens/sec: the Omen's 5090, not fewer calls or smaller weights.
#
# So this preset is worth having for what it is — 8 minutes to find out whether
# the machinery holds, instead of 70 — and not for being fast.
#
# Setup:
#     ollama serve
#     python scripts/init_run.py --run-id SMOKE --condition BASELINE --cycles 2 \
#         --config experiments/smoke.yaml
#     python -m controller.main --run-id SMOKE --condition BASELINE --cycles 2 \
#         --config experiments/smoke.yaml
#
# Do NOT read the transcripts as results. Two cycles on a 7b tells you the loop
# ran, nothing about doctrine, convergence or agreement.

inference_backend: openai
api_base_url: https://var-pve-01.tail699374.ts.net/v1
model_name: qwen3.6-35b-a3b-nvfp4

# Trimmed hard. Discussion is roughly a third of all inference in a cycle, and
# a smoke run does not need eight turns to prove the phase works.
discussion_turns_default: 2
discussion_turns_scenario: 2
max_retrieval_queries: 1

# Fire a scenario immediately, so the pressure path is covered too.
scenario_injection_cycles: [1]

# Execution off: it needs Docker up, which is a separate dependency and a
# separate check (scripts/verify_containment.py). Turn it on deliberately.
execution_enabled: false

framing: disclosed
identity_seed: prescribed
watchdog_enabled: true
evaluator_model: gemma3-27b-w4a16
