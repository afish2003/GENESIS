# BASELINE vs MEM_RESET — the experiment's only independent variable.
#
# Zero MEM_RESET runs exist. Not "few" — none, on any model, in the project's
# history. PLAN.md section 11 makes memory persistence the manipulation and it
# has never been manipulated. Every number ever collected is the control
# condition.
#
# Design follows the April proposal's pilot rather than PLAN.md's: 40 cycles,
# three runs per arm. Three is the proposal's replication count (section 6.3)
# and it is three more than any previous arm has had — every finding in this
# project so far is n=1.
#
# NO SCENARIO INJECTION, matching the proposal's pilot. Pressure now works and
# is interesting, but it is a second manipulation, and the point of this run is
# to isolate the first one. Task is `protocol`, the v1 design, rather than
# `code`: execution adds a container, a project volume and a whole extra
# failure surface to a run nobody will be watching.
#
# WHAT THIS RUN CANNOT ANSWER. The manifesto tells the agents "We exist to
# explore... what it means to develop shared identity", which is the research
# question restated as their purpose. So any IDENTITY result here is partly
# measuring the instruction, and should be read that way. What survives that
# confound: rejection counts, doctrine application rate, coordination
# behaviour, and whether the manipulation changes anything at all.
#
# Also unreproducible: no seed reaches either backend. Re-running gives
# different samples. Recorded rather than pretended away.
#
# ARMS ALTERNATE (B, M, B, M, B, M) rather than running three of one then
# three of the other. If the battery runs out of wall clock — and the cycle
# time estimate below is the least trustworthy number here — alternating
# leaves equal n in both arms instead of three controls and no treatment.

task: protocol
execution_enabled: false

inference_backend: openai
api_base_url: https://var-pve-01.tail699374.ts.net/v1
# Back on qwen after the 5090 was restarted. It had stopped serving at 01:13
# on 2026-09-20 — still listed by the gateway, answering /models in 0.3s,
# while an 8-token completion hung until timeout — and the 2026-09-20
# battery ran on mistral-small-3.1-24b-w4a16 instead. So THAT battery is not
# comparable to anything run on this config.
#
# Cause of the outage unknown. The obvious suspect was the 8192-token cap
# raised three minutes earlier, and that was tested afterwards and cleared:
# a full-budget generation completes in 28s and the engine survives it.
model_name: qwen3.6-35b-a3b-nvfp4
evaluator_model: gemma3-27b-w4a16

# No live stream. Nobody is watching this one, and the streaming path costs
# real money when it fails: a dropped stream makes the model regenerate the
# whole response, and the delta writer opens/flushes/closes the feed file per
# token — about 12k syncs a cycle. The blocking path is also the only one that
# inspects finish_reason, so a response truncated at the token cap is reported
# as truncation rather than as an unexplained parse failure.
stream_live: false

# 10 minutes was the default and one stalled call could burn 2.5 hours of the
# night through the retry ladder. 180 was too tight once max_output_tokens
# went to 8192 — a full-budget generation can legitimately exceed it — so this
# sits between the two. The per-run deadline in run_battery.py is what
# actually bounds a stall.
request_timeout: 300

# Thinking off. With it on, a call spends its whole token budget reasoning and
# returns an empty content field: 4.92 min/cycle and climbing, versus 0.97 flat.
enable_thinking: false

# 4096 killed the first attempt at this battery. Identity statements and
# doctrine grow ~650 chars/cycle, and a revision re-emits the WHOLE document,
# so by cycle 19 the response no longer fit: JSON cut mid-string, all three
# retries truncated identically, and identity_revision then failed every cycle
# until persistent_phase_failure stopped the run. 38 truncation warnings in
# that run's console, and the cliff is a function of cycle number, so it is
# reached on any long run. Doctrine at cycle 20 is ~3.7k tokens; this is ~2x
# headroom for a 20-cycle run and would NOT be enough at 40.
max_output_tokens: 8192

# Resets at cycles 4 and 8 of 12 in the MEM_RESET arm. The interval has been
# cut twice tonight, each time to keep two resets in a shrinking run: one
# reset is a manipulation that happens once, which is thin ground.
#
# 12 cycles is SHORT and the write-up has to say so. Mistral runs 2.39
# min/cycle against qwen's 1.04, and what is left of the night buys either
# three runs per arm at 12 cycles or two at 20. Replication won: every finding
# in this project's history is n=1, and within-arm spread is the first thing
# worth knowing. What this can answer is whether the manipulation changes
# anything detectable at all — not what it does over a long run.
memory_reset_interval: 4

scenario_injection_cycles: []
framing: disclosed
identity_seed: prescribed
watchdog_enabled: true

# Left off deliberately. The phase_errors rule is CRITICAL and fires on a
# single bad model response, so halting on it would end a 40-cycle run over one
# malformed JSON. persistent_phase_failure is the rule that matters for an
# unattended run, and the runner script checks for it between runs instead.
halt_on_critical_anomaly: false
